name: Test & Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux CTest (GCC + ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libqt6svg6-dev qt6-qpa-plugins qt6-wayland ffmpeg imagemagick librsvg2-bin uchardet curl tar xz-utils

      - name: Download standalone bundled engines
        run: |
          mkdir -p engines/pandoc engines/typst
          curl -sSL "https://github.com/jgm/pandoc/releases/download/3.1.13/pandoc-3.1.13-linux-amd64.tar.gz" -o pandoc.tar.gz
          tar -xzf pandoc.tar.gz
          cp pandoc-3.1.13/bin/pandoc engines/pandoc/pandoc
          chmod +x engines/pandoc/pandoc
          rm -rf pandoc.tar.gz pandoc-3.1.13

          curl -sSL "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
          tar -xJf typst.tar.xz
          cp typst-x86_64-unknown-linux-musl/typst engines/typst/typst
          chmod +x engines/typst/typst
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl

      - name: Configure CMake with Sanitizers (Debug)
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON

      - name: Build tests
        run: |
          cmake --build build --target tst_core --parallel $(nproc)

      - name: Run CTest
        run: |
          ctest --test-dir build --output-on-failure
