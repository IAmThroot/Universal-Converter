name: Build & Package Universal Converter

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libqt6svg6-dev qt6-qpa-plugins qt6-wayland libxcb-cursor0 ffmpeg imagemagick librsvg2-bin uchardet curl tar xz-utils

      - name: Download standalone bundled engines (Linux x86_64)
        run: |
          mkdir -p engines/pandoc engines/typst
          # 1. Download official standalone Pandoc (statically linked binary)
          if [ ! -f "engines/pandoc/pandoc" ]; then
            echo "--> Downloading Pandoc for Linux..."
            curl -sSL "https://github.com/jgm/pandoc/releases/download/3.1.13/pandoc-3.1.13-linux-amd64.tar.gz" -o pandoc.tar.gz
            tar -xzf pandoc.tar.gz
            cp pandoc-3.1.13/bin/pandoc engines/pandoc/pandoc
            chmod +x engines/pandoc/pandoc
            rm -rf pandoc.tar.gz pandoc-3.1.13
          fi

          # 2. Download official standalone Typst (musl statically linked binary)
          if [ ! -f "engines/typst/typst" ]; then
            echo "--> Downloading Typst for Linux..."
            curl -sSL "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
            tar -xJf typst.tar.xz
            cp typst-x86_64-unknown-linux-musl/typst engines/typst/typst
            cp typst-x86_64-unknown-linux-musl/LICENSE engines/typst/LICENSE 2>/dev/null || true
            cp typst-x86_64-unknown-linux-musl/NOTICE engines/typst/NOTICE 2>/dev/null || true
            chmod +x engines/typst/typst
            rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl
          fi

      - name: Download appimagetool
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

      - name: Build & Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x scripts/package-linux-appimage.sh
          ./scripts/package-linux-appimage.sh

      - name: Run regression suites and check package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure
          test -s dist/UniversalConverter-x86_64.AppImage
          dist/UniversalConverter.AppDir/usr/bin/engines/pandoc/pandoc --version
          dist/UniversalConverter.AppDir/usr/bin/engines/typst/typst --version
          echo 'Package smoke' > /tmp/uc-package-smoke.md
          dist/UniversalConverter.AppDir/usr/bin/engines/pandoc/pandoc /tmp/uc-package-smoke.md --pdf-engine="$PWD/dist/UniversalConverter.AppDir/usr/bin/engines/typst/typst" -o /tmp/uc-package-smoke.pdf
          test -s /tmp/uc-package-smoke.pdf

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: UniversalConverter-Linux-x86_64
          path: dist/UniversalConverter-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Windows x64 (NSIS + Portable ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Setup NSIS (Nullsoft Scriptable Install System)
        uses: nsis-dev/setup-nsis@v1

      - name: Download standalone bundled engines (Windows x64)
        shell: bash
        run: |
          mkdir -p engines/pandoc engines/typst
          # 1. Download official standalone Pandoc Windows zip
          echo "--> Downloading Pandoc for Windows..."
          curl -sSL "https://github.com/jgm/pandoc/releases/download/3.1.13/pandoc-3.1.13-windows-x86_64.zip" -o pandoc-win.zip
          unzip -q pandoc-win.zip
          cp pandoc-3.1.13/pandoc.exe engines/pandoc/pandoc.exe
          rm -rf pandoc-win.zip pandoc-3.1.13

          # 2. Download official standalone Typst Windows zip
          echo "--> Downloading Typst for Windows..."
          curl -sSL "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-pc-windows-msvc.zip" -o typst-win.zip
          unzip -q typst-win.zip
          cp typst-x86_64-pc-windows-msvc/typst.exe engines/typst/typst.exe
          cp typst-x86_64-pc-windows-msvc/LICENSE engines/typst/LICENSE 2>/dev/null || true
          cp typst-x86_64-pc-windows-msvc/NOTICE engines/typst/NOTICE 2>/dev/null || true
          rm -rf typst-win.zip typst-x86_64-pc-windows-msvc

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      - name: Build Universal Converter
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Run regression suites
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --verbose --output-on-failure

      - name: Summarize Windows test failures
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build/*-results.xml -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              [xml]$report = Get-Content -Raw $_.FullName
              foreach ($case in $report.testsuite.testcase) {
                foreach ($failure in $case.failure) {
                  Write-Host "$($case.name): $($failure.message)"
                }
              }
            } catch {
              Write-Warning "Incomplete test report: $($_.Exception.Message)"
            }
          }

      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            build/Testing/Temporary/
            build/*-results.xml
          if-no-files-found: ignore

      - name: Package with CPack (NSIS Installer + Portable ZIP)
        shell: bash
        run: |
          cd build
          cpack -C Release --verbose

      - name: Smoke test portable package
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/UniversalConverter-*-win64.zip | Select-Object -First 1
          if (!$archive) { throw "Portable archive missing" }
          $stage = Join-Path $env:RUNNER_TEMP "uc-portable-smoke"
          Expand-Archive $archive.FullName $stage
          $app = Get-ChildItem $stage -Filter UniversalConverter.exe -Recurse | Select-Object -First 1
          if (!$app) { throw "Packaged executable missing" }
          $root = $app.DirectoryName
          $source = Join-Path $stage "sample.md"
          Set-Content $source "Package smoke"
          & "$root\engines\pandoc\pandoc.exe" "$source" "--pdf-engine=$root\engines\typst\typst.exe" -o "$stage\sample.pdf"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$stage\sample.pdf")) { throw "Packaged PDF export failed" }
          Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Packaged application exited unexpectedly" }
          Stop-Process -Id $process.Id

      - name: Upload Windows Packages
        uses: actions/upload-artifact@v4
        with:
          name: UniversalConverter-Windows-x64
          path: |
            build/UniversalConverter-*-win64.exe
            build/UniversalConverter-*-win64.zip


  sanitizer:
    name: Linux sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev libqt6svg6-dev ffmpeg imagemagick pandoc librsvg2-bin
      - name: Install PDF typesetter
        run: |
          mkdir -p engines/typst
          curl --fail --location --retry 3 https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz -o "$RUNNER_TEMP/typst.tar.xz"
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" engines/typst/typst
          engines/typst/typst --version
      - name: Build and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build -G Ninja -DENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --verbose --output-on-failure
      - name: Upload sanitizer test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-test-diagnostics
          path: |
            build/Testing/Temporary/
            build/*-results.xml
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [ build-linux, build-windows, sanitizer ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: UniversalConverter-*

      - name: Stage release files
        run: |
          mkdir -p dist-release
          find release-assets/ -type f -exec cp -v {} dist-release/ \;
          echo "Files to upload:"
          ls -la dist-release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Universal Converter ${{ github.ref_name }}"
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false

