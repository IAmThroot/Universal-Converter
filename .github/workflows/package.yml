name: Build & Package Universal Converter

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: bash .github/scripts/install-linux-dependencies.sh qt6-wayland libxcb-cursor0

      - name: Download standalone bundled engines (Linux x86_64)
        run: |
          mkdir -p engines/pandoc engines/typst
          # 1. Download official standalone Pandoc (statically linked binary)
          if [ ! -f "engines/pandoc/pandoc" ]; then
            echo "--> Downloading Pandoc for Linux..."
            curl -fsSL --retry 3 "https://github.com/jgm/pandoc/releases/download/3.1.13/pandoc-3.1.13-linux-amd64.tar.gz" -o pandoc.tar.gz
            tar -xzf pandoc.tar.gz
            cp pandoc-3.1.13/bin/pandoc engines/pandoc/pandoc
            chmod +x engines/pandoc/pandoc
            rm -rf pandoc.tar.gz pandoc-3.1.13
          fi

          # 2. Download official standalone Typst (musl statically linked binary)
          if [ ! -f "engines/typst/typst" ]; then
            echo "--> Downloading Typst for Linux..."
            curl -fsSL --retry 3 "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
            tar -xJf typst.tar.xz
            cp typst-x86_64-unknown-linux-musl/typst engines/typst/typst
            cp typst-x86_64-unknown-linux-musl/LICENSE engines/typst/LICENSE 2>/dev/null || true
            cp typst-x86_64-unknown-linux-musl/NOTICE engines/typst/NOTICE 2>/dev/null || true
            chmod +x engines/typst/typst
            rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl
          fi

      - name: Download appimagetool
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          curl -fsSL --retry 3 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o "$RUNNER_TEMP/runtime-x86_64"
          echo "APPIMAGE_RUNTIME_FILE=$RUNNER_TEMP/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Build & Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x scripts/package-linux-appimage.sh
          ./scripts/package-linux-appimage.sh

      - name: Run regression suites and check package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure
          test -s dist/UniversalConverter-x86_64.AppImage
          dist/UniversalConverter.AppDir/usr/bin/engines/pandoc/pandoc --version
          dist/UniversalConverter.AppDir/usr/bin/engines/typst/typst --version
          echo 'Package smoke' > /tmp/uc-package-smoke.md
          dist/UniversalConverter.AppDir/usr/bin/engines/pandoc/pandoc /tmp/uc-package-smoke.md --pdf-engine="$PWD/dist/UniversalConverter.AppDir/usr/bin/engines/typst/typst" -o /tmp/uc-package-smoke.pdf
          test -s /tmp/uc-package-smoke.pdf
          image="$PWD/dist/UniversalConverter-x86_64.AppImage"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract > /dev/null
          status=0
          timeout 5s ./squashfs-root/AppRun || status=$?
          test "$status" -eq 124

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: UniversalConverter-Linux-x86_64
          path: dist/UniversalConverter-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Windows x64 (NSIS + Portable ZIP)
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Setup NSIS (Nullsoft Scriptable Install System)
        uses: nsis-dev/setup-nsis@v1

      - name: Download standalone bundled engines (Windows x64)
        shell: bash
        run: |
          mkdir -p engines/pandoc engines/typst
          # 1. Download official standalone Pandoc Windows zip
          echo "--> Downloading Pandoc for Windows..."
          curl -fsSL --retry 3 "https://github.com/jgm/pandoc/releases/download/3.1.13/pandoc-3.1.13-windows-x86_64.zip" -o pandoc-win.zip
          unzip -q pandoc-win.zip
          cp pandoc-3.1.13/pandoc.exe engines/pandoc/pandoc.exe
          rm -rf pandoc-win.zip pandoc-3.1.13

          # 2. Download official standalone Typst Windows zip
          echo "--> Downloading Typst for Windows..."
          curl -fsSL --retry 3 "https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-pc-windows-msvc.zip" -o typst-win.zip
          unzip -q typst-win.zip
          cp typst-x86_64-pc-windows-msvc/typst.exe engines/typst/typst.exe
          cp typst-x86_64-pc-windows-msvc/LICENSE engines/typst/LICENSE 2>/dev/null || true
          cp typst-x86_64-pc-windows-msvc/NOTICE engines/typst/NOTICE 2>/dev/null || true
          rm -rf typst-win.zip typst-x86_64-pc-windows-msvc

      - name: Install Windows media tools for integration tests
        shell: bash
        run: |
          tools_dir="$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/media-tools.XXXXXX")"
          cd "$tools_dir"
          curl -fsSL --retry 3 https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-full_build.7z -o ffmpeg.7z
          curl -fsSL --retry 3 https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-36/ImageMagick-7.1.2-36-portable-Q16-HDRI-x64.7z -o magick.7z
          sha256sum -c <<'CHECKSUMS'
          973db2088fc8dacc927443a95e1ddbfc686170a7e748d0ac810ae5ab81587b30  ffmpeg.7z
          e7c705840e2d989eb9fdbd5c2ac87c5b7a9f95b97daee1a1e6e66aa152548ae5  magick.7z
          CHECKSUMS
          7z x -y ffmpeg.7z > /dev/null
          7z x -y -omagick magick.7z > /dev/null
          ffmpeg_bin="$tools_dir/ffmpeg-8.0-full_build/bin"
          "$ffmpeg_bin/ffmpeg.exe" -version
          "$ffmpeg_bin/ffprobe.exe" -version
          "$tools_dir/magick/magick.exe" -version
          cygpath -aw "$ffmpeg_bin" "$tools_dir/magick" >> "$GITHUB_PATH"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build Universal Converter
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Run regression suites
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --verbose --output-on-failure

      - name: Summarize Windows test failures
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build/*-results.xml -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              [xml]$report = Get-Content -Raw $_.FullName
              foreach ($case in $report.testsuite.testcase) {
                foreach ($failure in $case.failure) {
                  Write-Host "$($case.name): $($failure.message)"
                }
              }
            } catch {
              Write-Warning "Incomplete test report: $($_.Exception.Message)"
            }
          }

      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            build/Testing/Temporary/
            build/*-results.xml
          if-no-files-found: ignore

      - name: Package with CPack (NSIS Installer + Portable ZIP)
        shell: bash
        run: |
          cd build
          cpack -C Release --verbose
          test -s UniversalConverter-*-win64.exe
          test -s UniversalConverter-*-win64.zip

      - name: Smoke test portable package
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/UniversalConverter-*-win64.zip | Select-Object -First 1
          if (!$archive) { throw "Portable archive missing" }
          $stage = Join-Path $env:RUNNER_TEMP "uc-portable-smoke"
          Expand-Archive $archive.FullName $stage
          $app = Get-ChildItem $stage -Filter UniversalConverter.exe -Recurse | Select-Object -First 1
          if (!$app) { throw "Packaged executable missing" }
          $root = $app.DirectoryName
          $source = Join-Path $stage "sample.md"
          Set-Content $source "Package smoke"
          & "$root\engines\pandoc\pandoc.exe" "$source" "--pdf-engine=$root\engines\typst\typst.exe" -o "$stage\sample.pdf"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$stage\sample.pdf")) { throw "Packaged PDF export failed" }
          Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Packaged application exited unexpectedly" }
          Stop-Process -Id $process.Id

      - name: Upload Windows Packages
        uses: actions/upload-artifact@v4
        with:
          name: UniversalConverter-Windows-x64
          if-no-files-found: error
          path: |
            build/UniversalConverter-*-win64.exe
            build/UniversalConverter-*-win64.zip


  sanitizer:
    # Branch and PR pushes already run test.yml. For tags, gate publication on that same suite.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml

  release:
    name: Publish GitHub Release
    needs: [ build-linux, build-windows, sanitizer ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: UniversalConverter-*

      - name: Stage release files
        run: |
          mkdir -p dist-release
          version="${GITHUB_REF_NAME#v}"
          for file in "UniversalConverter-x86_64.AppImage" "UniversalConverter-$version-win64.exe" "UniversalConverter-$version-win64.zip"; do
            case "$file" in
              *.AppImage) source="release-assets/UniversalConverter-Linux-x86_64/$file" ;;
              *) source="release-assets/UniversalConverter-Windows-x64/$file" ;;
            esac
            test -s "$source"
            cp "$source" dist-release/
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Universal Converter ${{ github.ref_name }}"
          files: dist-release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

